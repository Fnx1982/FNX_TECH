<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script src="config.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="login.css" />
    <script src="auth-worker.js?v=6"></script>
    <script src="auth-guard.js"></script>
    <title>Trocar senha — FNX TECH</title>
  <link rel="stylesheet" href="mobile.css?v=3" />
  <link rel="stylesheet" href="fnx-tema.css?v=8" />
</head>
<body>
    <main class="container">
        <form onsubmit="event.preventDefault(); trocarSenha();">
            <h1>Nova senha</h1>
            <p style="text-align:center; font-size:13px; color:#666; margin-bottom:18px;">
                Você entrou com uma senha temporária. Escolha uma senha nova pra continuar.
            </p>
            <div class="input-box">
                <input id="novaSenha" placeholder="Nova senha (mín. 8 caracteres)" type="password" required minlength="8" />
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="input-box">
                <input id="confirmarSenha" placeholder="Confirme a nova senha" type="password" required minlength="8" />
                <i class="bx bxs-lock-alt"></i>
            </div>

            <button type="submit" class="login">Salvar e continuar</button>
            <p id="mensagemErroTroca" style="color: crimson; text-align: center; margin-top: 10px; font-size: 13px; display: none;"></p>
        </form>
    </main>

    <script src="trocar-senha.js"></script>
  <script src="modal-expandir.js?v=1"></script>
  <footer class="fnx-rodape">Created by Yan Victor · <a href="https://www.instagram.com/yanszaida/" target="_blank" rel="noopener">@yanszaida</a></footer>
  <script src="campos-acesso.js?v=2"></script>
</body>
</html>
