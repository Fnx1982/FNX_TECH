<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="config.js"></script>
  <script src="auth-worker.js?v=7"></script>
  <script src="auth-guard.js?v=2"></script>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0B0B0C" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boards — FNX DEV</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="quadros.css?v=3" />
  <script src="confirm-modal.js?v=2"></script>
  <link rel="stylesheet" href="mobile.css?v=3" />
  <link rel="stylesheet" href="fnx-tema.css?v=10" />
</head>
<body class="pagina-quadros">

  <!-- ===== LISTA DE QUADROS ===== -->
  <main class="tela-quadros" id="telaQuadros">
    <div class="topo-quadros">
      <div>
        <h1>Boards</h1>
        <p>Organize tarefas e sprints em listas e cartões.</p>
      </div>
      <a href="home.html" class="btn-voltar">← Voltar</a>
    </div>
    <div class="barra-filtro-boards">
      <div class="busca-boards">
        <i class="bx bx-search"></i>
        <input type="search" id="buscaBoards" placeholder="Buscar board pelo nome…" aria-label="Buscar board" />
      </div>
      <div class="abas-boards" role="tablist" aria-label="Situação dos boards">
        <button type="button" class="ativo" data-filtro-board="ativos" role="tab">Ativos <span id="contBoardsAtivos"></span></button>
        <button type="button" data-filtro-board="arquivados" role="tab"><i class="bx bx-archive"></i> Arquivados <span id="contBoardsArquivados"></span></button>
      </div>
      <label class="so-meus"><input type="checkbox" id="soMeusBoards" /> Só os que eu criei</label>
      <select id="ordemBoards" aria-label="Ordenar boards">
        <option value="recentes">Mais recentes</option>
        <option value="nome">Nome (A–Z)</option>
        <option value="cartoes">Mais cartões</option>
      </select>
    </div>
    <div class="grade-quadros" id="gradeQuadros">
      <div class="carregando">Carregando boards…</div>
    </div>
  </main>

  <!-- ===== QUADRO ABERTO ===== -->
  <section class="tela-quadro" id="telaQuadro" hidden>
    <header class="barra-quadro" id="barraQuadro">
      <button type="button" class="btn-icone-claro" id="btnVoltarQuadros" title="Todos os boards" aria-label="Todos os boards"><i class="bx bx-arrow-back"></i></button>
      <h1 id="nomeQuadro" class="nome-quadro" title="Clique para renomear"></h1>
      <div class="barra-quadro-acoes">
        <div class="busca-quadro">
          <i class="bx bx-search"></i>
          <input type="search" id="buscaCartoes" placeholder="Buscar cartões…" aria-label="Buscar cartões" />
        </div>
        <select id="filtroResponsavel" aria-label="Filtrar por responsável">
          <option value="">Todos</option>
          <option value="__meus">Meus cartões</option>
        </select>
        <select id="filtroEtiqueta" aria-label="Filtrar por etiqueta">
          <option value="">Todas as etiquetas</option>
        </select>
        <button type="button" class="btn-icone-claro" id="btnArquivadosQuadro" title="Cartões arquivados" aria-label="Cartões arquivados"><i class="bx bx-archive"></i><span class="badge-arq" id="badgeArquivados" hidden></span></button>
        <button type="button" class="btn-icone-claro" id="btnConfigQuadro" title="Configurar board" aria-label="Configurar board"><i class="bx bx-cog"></i></button>
      </div>
    </header>
    <div class="area-listas" id="areaListas"></div>
  </section>

  <!-- ===== MODAL: CARTÃO ===== -->
  <div class="modal-overlay" id="modalCartao">
    <div class="modal-cartao" role="dialog" aria-modal="true" aria-labelledby="tituloCartao">
      <button type="button" class="modal-fechar" id="fecharModalCartao" aria-label="Fechar">&times;</button>
      <div class="cartao-cabecalho">
        <i class="bx bx-credit-card-front"></i>
        <div class="cartao-cabecalho-textos">
          <textarea id="tituloCartao" rows="1" maxlength="200" aria-label="Título do cartão"></textarea>
          <div class="cartao-na-lista">na lista <select id="cartaoLista" aria-label="Mover para a lista"></select></div>
        </div>
      </div>

      <div class="cartao-corpo">
        <div class="cartao-principal">
          <div class="cartao-meta" id="cartaoMeta"></div>

          <h3><i class="bx bx-align-left"></i> Descrição</h3>
          <textarea id="descricaoCartao" rows="4" placeholder="Adicione uma descrição mais detalhada…"></textarea>

          <h3><i class="bx bx-check-square"></i> Checklist <span id="progressoChecklistTexto" class="progresso-texto"></span></h3>
          <div class="barra-progresso"><span id="barraProgressoChecklist"></span></div>
          <ul class="checklist" id="checklistCartao"></ul>
          <form class="linha-add" id="formChecklist">
            <input type="text" id="novoItemChecklist" placeholder="Adicionar um item" maxlength="200" />
            <button type="submit" class="btn-laranja">Adicionar</button>
          </form>

          <h3><i class="bx bx-message-rounded-dots"></i> Comentários</h3>
          <form class="linha-add" id="formComentario">
            <textarea id="novoComentario" rows="2" placeholder="Escreva um comentário…" maxlength="2000"></textarea>
            <button type="submit" class="btn-laranja">Comentar</button>
          </form>
          <ul class="comentarios" id="comentariosCartao"></ul>
        </div>

        <aside class="cartao-lateral">
          <h4>Adicionar ao cartão</h4>
          <label class="campo-lateral">
            <span><i class="bx bx-user"></i> Responsáveis</span>
            <div class="lista-escolhas" id="escolhaResponsaveis"></div>
          </label>
          <label class="campo-lateral">
            <span><i class="bx bx-purchase-tag"></i> Etiquetas</span>
            <div class="lista-escolhas" id="escolhaEtiquetas"></div>
          </label>
          <label class="campo-lateral">
            <span><i class="bx bx-time"></i> Prazo</span>
            <input type="date" id="prazoCartao" />
          </label>
          <label class="campo-check">
            <input type="checkbox" id="concluidoCartao" /> Concluído
          </label>
          <label class="campo-lateral">
            <span><i class="bx bx-palette"></i> Capa</span>
            <div class="cores-capa" id="coresCapa"></div>
          </label>

          <h4>Ações</h4>
          <button type="button" class="btn-lateral" id="btnSalvarCartao"><i class="bx bx-save"></i> Salvar</button>
          <button type="button" class="btn-lateral" id="btnArquivarCartao"><i class="bx bx-archive-in"></i> Arquivar cartão</button>
          <button type="button" class="btn-lateral perigo" id="btnExcluirCartao"><i class="bx bx-trash"></i> Excluir cartão</button>
          <p class="cartao-autoria" id="cartaoAutoria"></p>
        </aside>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: QUADRO (novo / configurar) ===== -->
  <div class="modal-overlay" id="modalQuadro">
    <div class="modal-caixa-q" role="dialog" aria-modal="true" aria-labelledby="tituloModalQuadro">
      <div class="modal-cabecalho-q">
        <h2 id="tituloModalQuadro">Novo board</h2>
        <button type="button" class="modal-fechar" id="fecharModalQuadro" aria-label="Fechar">&times;</button>
      </div>
      <form id="formQuadro">
        <label class="campo-q">Nome do board
          <input type="text" id="campoNomeQuadro" maxlength="80" required placeholder="Ex: Sprint 12, Suporte, Roadmap" />
        </label>
        <div class="campo-q">Cor
          <div class="cores-capa" id="coresQuadro"></div>
        </div>
        <div class="campo-q" id="blocoEtiquetas">Etiquetas
          <div id="listaEtiquetasQuadro" class="etiquetas-edicao"></div>
          <button type="button" class="btn-link" id="btnNovaEtiqueta">+ Nova etiqueta</button>
        </div>
        <div class="rodape-q">
          <div class="acoes-perigo-q">
            <button type="button" class="btn-lateral" id="btnArquivarQuadro" hidden><i class="bx bx-archive-in"></i> Arquivar board</button>
            <button type="button" class="btn-lateral perigo" id="btnExcluirQuadro" hidden><i class="bx bx-trash"></i> Excluir board</button>
          </div>
          <button type="submit" class="btn-laranja" id="btnSalvarQuadro">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL: CARTÕES ARQUIVADOS ===== -->
  <div class="modal-overlay" id="modalArquivados">
    <div class="modal-caixa-q" role="dialog" aria-modal="true" aria-labelledby="tituloArquivados">
      <div class="modal-cabecalho-q">
        <h2 id="tituloArquivados">Cartões arquivados</h2>
        <button type="button" class="modal-fechar" id="fecharModalArquivados" aria-label="Fechar">&times;</button>
      </div>
      <div class="corpo-arquivados">
        <input type="search" id="buscaArquivados" placeholder="Buscar nos arquivados…" aria-label="Buscar nos arquivados" />
        <ul class="lista-arquivados" id="listaArquivados"></ul>
      </div>
    </div>
  </div>

  <script src="quadros.js?v=3"></script>
  <script src="notificacoes.js?v=4"></script>
  <footer class="fnx-rodape">Created by Yan Victor · <a href="https://www.instagram.com/yanszaida/" target="_blank" rel="noopener">@yanszaida</a></footer>
</body>
</html>
